<!doctype html>
<html lang="en">

<head>
    <link rel="manifest" href="/manifest.json" />

    <meta charset="utf-8">
    <title>Dashboard | GFTV HelloQueue</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="GFTV Virtual Queue Management System">

    <meta property="og:type" content="website">
    <meta property="og:title" content="Dashboard | GFTV HelloQueue" />
    <meta property="og:site_name" content="GFTV TIDSC" />
    <meta property="og:description" content="GFTV Virtual Queue Management System" />

    <meta name="theme-color" content="#f4f4f4" />
    <script>
        // Pre-paint: land both theme axes before first paint, so every colour
        // block can select on both without an attribute-missing fallback.
        (function () {
            var appKey = "gftv-helloqueue";

            // The stored preference: "light", "dark" or "time". Light when
            // nothing is stored.
            var mode = "light";
            var storedMode = localStorage.getItem(appKey + ".mode");
            if (storedMode) {
                mode = storedMode;
            }

            // Time based mode. Resolved here rather than in script.js because
            // that module runs after first paint, and an evening reader would
            // otherwise watch a light page turn dark. Keep the two hours in
            // step with LIGHT_FROM_HOUR and LIGHT_UNTIL_HOUR in script.js.
            if (mode === "time") {
                var currentHour = new Date().getHours();
                if (currentHour >= 9 && currentHour < 18) {
                    mode = "light";
                } else {
                    mode = "dark";
                }
                document.documentElement.setAttribute("data-mode-preference", "time");
            } else if (mode !== "dark") {
                mode = "light";
            }

            var colorTheme = "classic";
            var storedColorTheme = localStorage.getItem(appKey + ".colorTheme");
            if (storedColorTheme) {
                colorTheme = storedColorTheme;
            }
            document.documentElement.setAttribute("data-mode", mode);
            document.documentElement.setAttribute("data-color-theme", colorTheme);
        })();
    </script>
    <link rel="stylesheet" href="/style.css">

    <!-- Embed Image -->
    <link rel="apple-touch-icon" href="/GHQ-main.png">
    <link rel="icon" href="/favicon.ico">
    <link rel="shortcut icon" href="/favicon.ico">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:image:src" content="/GHQ-main.png">
    <meta property="og:image" content="/GHQ-main.png" />
</head>

<body>

    <div id="topbar-root"></div>

    <div class="dashboard-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <button class="sidebar-item active" id="nav-events" data-view="events">
                <span id="nav-events-icon"></span> Events
            </button>
            <button class="sidebar-item" id="nav-queues" data-view="queues">
                <span id="nav-queues-icon"></span> My Queues
            </button>
            <button class="sidebar-item" id="nav-profile" data-view="profile">
                <span id="nav-profile-icon"></span> Profile
            </button>
            <div id="nav-admin-section" style="display:none;">
                <hr class="divider" />
                <div class="section-label" style="padding:0 14px;">Admin</div>
                <button class="sidebar-item" data-view="admin-users">
                    <span id="nav-users-icon"></span> Users
                </button>
            </div>
        </aside>

        <!-- Main -->
        <main class="main-content" id="main-content">
            <div style="display:flex;align-items:center;justify-content:center;height:200px;">
                <div class="loader"></div>
            </div>
        </main>
    </div>

    <div id="toast-container" class="toast-container"></div>

    <script type="module">
        import { initTheme, buildTopbar, requireLogin, getUser, api, toast, Icons, openThemeModal } from '/script.js';
        import { renderEventsView } from '/views/events.js';
        import { renderQueuesView } from '/views/queues.js';
        import { renderProfileView } from '/views/profile.js';
        import { renderAdminUsersView } from '/views/admin-users.js';
        import { renderQueueOperatorView } from '/views/queue-operator.js';
        import { buildOfficialBar } from '/official-bar.js';

        initTheme();
        buildOfficialBar();
        if (!requireLogin()) {
            throw new Error('not logged in');
        }
        buildTopbar(document.getElementById('topbar-root'));

        const user = getUser();
        const mainContent = document.getElementById('main-content');

        // Inject icons
        document.getElementById('nav-events-icon').innerHTML = Icons.calendar;
        document.getElementById('nav-queues-icon').innerHTML = Icons.list;
        document.getElementById('nav-profile-icon').innerHTML = Icons.user;
        if (user && user.is_admin) {
            document.getElementById('nav-admin-section').style.display = 'block';
            document.getElementById('nav-users-icon').innerHTML = Icons.users;
        }

        // Router: each sidebar view, by its data-view name.
        const views = {
            'events': renderEventsView,
            'queues': renderQueuesView,
            'profile': renderProfileView,
            'admin-users': renderAdminUsersView,
        };

        let currentView = 'events';

        // Shows a view in the main area and marks its sidebar button active.
        // `viewOptions` are passed on to the view.
        function navigate(view, viewOptions = {}) {
            currentView = view;
            document.querySelectorAll('.sidebar-item').forEach((sidebarButton) => {
                sidebarButton.classList.toggle('active', sidebarButton.dataset.view === view);
            });

            const renderer = views[view];
            if (renderer) {
                renderer(mainContent, { user, navigate, ...viewOptions });
            }
        }

        // Listen for queue operator deep link
        window.addEventListener('hq:openqueue', (event) => {
            renderQueueOperatorView(mainContent, { user, navigate, queueId: event.detail.queueId, eventId: event.detail.eventId });
        });

        document.querySelectorAll('.sidebar-item').forEach((sidebarButton) => {
            sidebarButton.addEventListener('click', () => navigate(sidebarButton.dataset.view));
        });

        // Check URL for deep link: /dashboard/events/<eventId>/queues/<queueId>
        // opens that queue's operator view.
        const path = window.location.pathname;
        const queueMatch = path.match(/\/dashboard\/events\/([^/]+)\/queues\/([^/]+)/);
        if (queueMatch) {
            renderQueueOperatorView(mainContent, { user, navigate, eventId: queueMatch[1], queueId: queueMatch[2] });
        } else {
            navigate('events');
        }
    </script>

    <script type="module" src="/sw-register.js"></script>

</body>

</html>

<!doctype html>
<html lang="en">

<head>
    <link rel="manifest" href="/manifest.json" />

    <meta charset="utf-8">
    <title>Register | GFTV HelloQueue</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="GFTV Virtual Queue Management System">

    <meta property="og:type" content="website">
    <meta property="og:title" content="Register | GFTV HelloQueue" />
    <meta property="og:site_name" content="GFTV TIDSC" />
    <meta property="og:description" content="GFTV Virtual Queue Management System" />

    <meta name="theme-color" content="#f4f4f4" />
    <script>
        // Pre-paint: land both theme axes before first paint, so every colour
        // block can select on both without an attribute-missing fallback.
        (function () {
            var appKey = "gftv-helloqueue";

            // The stored preference: "light", "dark" or "time". Light when
            // nothing is stored.
            var mode = "light";
            var storedMode = localStorage.getItem(appKey + ".mode");
            if (storedMode) {
                mode = storedMode;
            }

            // Time based mode. Resolved here rather than in script.js because
            // that module runs after first paint, and an evening reader would
            // otherwise watch a light page turn dark. Keep the two hours in
            // step with LIGHT_FROM_HOUR and LIGHT_UNTIL_HOUR in script.js.
            if (mode === "time") {
                var currentHour = new Date().getHours();
                if (currentHour >= 9 && currentHour < 18) {
                    mode = "light";
                } else {
                    mode = "dark";
                }
                document.documentElement.setAttribute("data-mode-preference", "time");
            } else if (mode !== "dark") {
                mode = "light";
            }

            var colorTheme = "classic";
            var storedColorTheme = localStorage.getItem(appKey + ".colorTheme");
            if (storedColorTheme) {
                colorTheme = storedColorTheme;
            }
            document.documentElement.setAttribute("data-mode", mode);
            document.documentElement.setAttribute("data-color-theme", colorTheme);
        })();
    </script>
    <link rel="stylesheet" href="/style.css">

    <!-- Embed Image -->
    <link rel="apple-touch-icon" href="/GHQ-main.png">
    <link rel="icon" href="/favicon.ico">
    <link rel="shortcut icon" href="/favicon.ico">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:image:src" content="/GHQ-main.png">
    <meta property="og:image" content="/GHQ-main.png" />
</head>

<body>

    <div id="topbar-root"></div>

    <div class="auth-page">
        <div class="glass-card auth-card">
            <div class="auth-title">Create account</div>
            <div class="auth-sub">Join HelloQueue – your account will be reviewed before activation</div>

            <form id="register-form">
                <div class="form-group">
                    <label for="display_name">Display Name</label>
                    <input type="text" id="display_name" placeholder="Augy the Fox" required />
                </div>
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="augyfox" required autocomplete="username" />
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="you@example.com" required autocomplete="email" />
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Min. 8 characters" required
                        autocomplete="new-password" />
                </div>
                <div id="reg-error"
                    style="color:var(--status-error);font-size:0.85rem;margin-bottom:12px;display:none;"></div>
                <div id="reg-success"
                    style="color:var(--status-serving);font-size:0.85rem;margin-bottom:12px;display:none;"></div>
                <button type="submit" class="btn btn-primary w-full" id="reg-btn">Create account</button>
            </form>

            <hr class="divider" />
            <div class="text-sm text-muted" style="text-align:center;">
                Already have an account? <a href="/login" class="auth-link">Sign in</a>
            </div>
        </div>
    </div>

    <div id="toast-container" class="toast-container"></div>

    <script type="module">
        import { initTheme, buildTopbar, api } from '/script.js';
        import { buildOfficialBar } from '/official-bar.js';

        initTheme();
        buildOfficialBar();
        buildTopbar(document.getElementById('topbar-root'));

        const form = document.getElementById('register-form');
        const errorMessage = document.getElementById('reg-error');
        const successMessage = document.getElementById('reg-success');
        const createAccountButton = document.getElementById('reg-btn');

        // Creates the account, which waits for an admin's approval. On success
        // the form is cleared and the button stays disabled, reading "Done".
        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            errorMessage.style.display = 'none';
            successMessage.style.display = 'none';
            createAccountButton.disabled = true;
            createAccountButton.textContent = 'Creating account…';

            try {
                await api('/auth/register', {
                    method: 'POST',
                    body: {
                        display_name: document.getElementById('display_name').value.trim(),
                        username: document.getElementById('username').value.trim(),
                        email: document.getElementById('email').value.trim(),
                        password: document.getElementById('password').value,
                    },
                });
                successMessage.textContent = 'Account created! Please wait for an admin to approve your account.';
                successMessage.style.display = 'block';
                form.reset();
                createAccountButton.textContent = 'Done';
            } catch (error) {
                errorMessage.textContent = error.message;
                errorMessage.style.display = 'block';
                createAccountButton.disabled = false;
                createAccountButton.textContent = 'Create account';
            }
        });
    </script>

    <script type="module" src="/sw-register.js"></script>

</body>

</html>

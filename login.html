<!doctype html>
<html lang="en">

<head>
    <link rel="manifest" href="/manifest.json" />

    <meta charset="utf-8">
    <title>Login | GFTV HelloQueue</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="GFTV Virtual Queue Management System">

    <meta property="og:type" content="website">
    <meta property="og:title" content="Login | GFTV HelloQueue" />
    <meta property="og:site_name" content="GFTV TIDSC" />
    <meta property="og:description" content="GFTV Virtual Queue Management System" />

    <meta name="theme-color" content="#f4f4f4" />
    <script>
        // Pre-paint: land both theme axes before first paint, so every colour
        // block can select on both without an attribute-missing fallback.
        (function () {
            var appKey = "gftv-helloqueue";

            // The stored preference: "light", "dark" or "time". Light when
            // nothing is stored.
            var mode = "light";
            var storedMode = localStorage.getItem(appKey + ".mode");
            if (storedMode) {
                mode = storedMode;
            }

            // Time based mode. Resolved here rather than in script.js because
            // that module runs after first paint, and an evening reader would
            // otherwise watch a light page turn dark. Keep the two hours in
            // step with LIGHT_FROM_HOUR and LIGHT_UNTIL_HOUR in script.js.
            if (mode === "time") {
                var currentHour = new Date().getHours();
                if (currentHour >= 9 && currentHour < 18) {
                    mode = "light";
                } else {
                    mode = "dark";
                }
                document.documentElement.setAttribute("data-mode-preference", "time");
            } else if (mode !== "dark") {
                mode = "light";
            }

            var colorTheme = "classic";
            var storedColorTheme = localStorage.getItem(appKey + ".colorTheme");
            if (storedColorTheme) {
                colorTheme = storedColorTheme;
            }
            document.documentElement.setAttribute("data-mode", mode);
            document.documentElement.setAttribute("data-color-theme", colorTheme);
        })();
    </script>
    <link rel="stylesheet" href="/style.css">

    <!-- Embed Image -->
    <link rel="apple-touch-icon" href="/GHQ-main.png">
    <link rel="icon" href="/favicon.ico">
    <link rel="shortcut icon" href="/favicon.ico">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:image:src" content="/GHQ-main.png">
    <meta property="og:image" content="/GHQ-main.png" />
</head>

<body>

    <div id="topbar-root"></div>

    <div class="auth-page">
        <div class="glass-card auth-card">
            <div class="auth-title">Welcome back</div>
            <div class="auth-sub">Sign in to HelloQueue</div>

            <form id="login-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="your_username" autocomplete="username"
                        required />
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="••••••••"
                        autocomplete="current-password" required />
                </div>
                <div id="login-error"
                    style="color:var(--status-error);font-size:0.85rem;margin-bottom:12px;display:none;"></div>
                <button type="submit" class="btn btn-primary w-full" id="login-btn">Sign in</button>
            </form>

            <hr class="divider" />
            <div class="text-sm text-muted" style="text-align:center;">
                Don't have an account? <a href="/register" class="auth-link">Register</a>
            </div>
        </div>
    </div>

    <!-- 2FA modal -->
    <div class="modal-overlay" id="totp-modal">
        <div class="modal">
            <div class="modal-header">
                <span class="modal-title">Two-Factor Authentication</span>
            </div>
            <div style="padding:0 4px 4px;">
                <p class="text-sm text-muted" style="margin-bottom:16px;">Enter the 6-digit code from your authenticator app.</p>
                <div class="form-group">
                    <label for="totp-code" id="totp-code-label">Authentication Code</label>
                    <input type="text" id="totp-code" inputmode="numeric" pattern="[0-9 ]*"
                        maxlength="7" placeholder="000 000" autocomplete="one-time-code"
                        style="font-size:1.5rem;letter-spacing:0.15em;text-align:center;" />
                </div>
                <div style="text-align:center;margin-bottom:12px;">
                    <button type="button" class="btn btn-ghost btn-sm" id="totp-toggle-backup">Use a backup code instead</button>
                </div>
                <div id="totp-error" style="color:var(--status-error);font-size:0.85rem;margin-bottom:12px;display:none;"></div>
                <label style="display:flex;align-items:center;gap:8px;margin-bottom:14px;cursor:pointer;font-size:0.875rem;">
                    <input type="checkbox" id="totp-trust-device" />
                    Trust this device for 30 days
                </label>
                <button class="btn btn-primary w-full" id="totp-submit-btn">Verify</button>
                <button class="btn btn-ghost w-full" id="totp-cancel-btn" style="margin-top:8px;">Back to login</button>
            </div>
        </div>
    </div>

    <div id="theme-modal-root"></div>
    <div id="toast-container" class="toast-container"></div>

    <script type="module">
        import { initTheme, buildTopbar, saveAuth, getToken, api, toast } from '/script.js';
        import { buildOfficialBar } from '/official-bar.js';

        initTheme();
        buildOfficialBar();
        buildTopbar(document.getElementById('topbar-root'));

        if (getToken()) {
            window.location.href = '/dashboard';
        }

        const form = document.getElementById('login-form');
        const loginErrorMessage = document.getElementById('login-error');
        const signInButton = document.getElementById('login-btn');

        const totpModal = document.getElementById('totp-modal');
        const totpInput = document.getElementById('totp-code');
        const totpErrorMessage = document.getElementById('totp-error');
        const totpSubmitButton = document.getElementById('totp-submit-btn');
        let pendingTotpToken = null;

        function openTotpModal(token) {
            pendingTotpToken = token;
            totpInput.value = '';
            totpErrorMessage.style.display = 'none';
            totpModal.classList.add('open');
            setTimeout(() => totpInput.focus(), 50);
        }

        function closeTotpModal() {
            totpModal.classList.remove('open');
            pendingTotpToken = null;
            signInButton.disabled = false;
            signInButton.textContent = 'Sign in';
        }

        document.getElementById('totp-cancel-btn').addEventListener('click', closeTotpModal);

        // The modal takes either a 6-digit code from an authenticator app or a
        // backup code. This button switches the input between the two.
        let backupMode = false;
        const backupToggleButton = document.getElementById('totp-toggle-backup');
        const codeLabel = document.getElementById('totp-code-label');

        backupToggleButton.addEventListener('click', () => {
            backupMode = !backupMode;
            totpInput.value = '';
            if (backupMode) {
                totpInput.setAttribute('inputmode', 'text');
                totpInput.removeAttribute('pattern');
                totpInput.setAttribute('maxlength', '20');
                totpInput.placeholder = 'XXXX-XXXX-XXXX';
                totpInput.style.fontSize = '1.1rem';
                codeLabel.textContent = 'Backup Code';
                backupToggleButton.textContent = 'Use authenticator app instead';
            } else {
                totpInput.setAttribute('inputmode', 'numeric');
                totpInput.setAttribute('pattern', '[0-9 ]*');
                totpInput.setAttribute('maxlength', '7');
                totpInput.placeholder = '000 000';
                totpInput.style.fontSize = '1.5rem';
                codeLabel.textContent = 'Authentication Code';
                backupToggleButton.textContent = 'Use a backup code instead';
            }
            totpInput.focus();
        });

        // Auto-format as "000 000" in TOTP mode only
        totpInput.addEventListener('input', () => {
            if (backupMode) {
                return;
            }
            const digits = totpInput.value.replace(/\D/g, '').slice(0, 6);
            if (digits.length > 3) {
                totpInput.value = digits.slice(0, 3) + ' ' + digits.slice(3);
            } else {
                totpInput.value = digits;
            }
        });

        // Verify: checks the code's length, then sends it with the pending
        // sign-in's token. On success it saves the session (and the device
        // token, when "Trust this device" is ticked) and opens the dashboard.
        totpSubmitButton.addEventListener('click', async () => {
            const code = totpInput.value.replace(/\s/g, '');
            if (!backupMode && code.length !== 6) {
                totpErrorMessage.textContent = 'Please enter a 6-digit code';
                totpErrorMessage.style.display = 'block';
                return;
            }
            if (backupMode && code.length < 4) {
                totpErrorMessage.textContent = 'Please enter your backup code';
                totpErrorMessage.style.display = 'block';
                return;
            }
            totpErrorMessage.style.display = 'none';
            totpSubmitButton.disabled = true;
            totpSubmitButton.textContent = 'Verifying…';
            try {
                const trustDevice = document.getElementById('totp-trust-device').checked;
                const data = await api('/auth/totp-verify', {
                    method: 'POST',
                    body: { totp_token: pendingTotpToken, code, trust_device: trustDevice },
                });
                if (data.device_token) {
                    localStorage.setItem('hq_device_token', data.device_token);
                }
                saveAuth(data.token, data.user);
                window.location.href = '/dashboard';
            } catch (error) {
                totpErrorMessage.textContent = error.message;
                totpErrorMessage.style.display = 'block';
                totpSubmitButton.disabled = false;
                totpSubmitButton.textContent = 'Verify';
                totpInput.select();
            }
        });

        totpInput.addEventListener('keydown', (event) => {
            if (event.key === 'Enter') {
                totpSubmitButton.click();
            }
        });

        // Sign in: sends the username and password, with this device's trusted
        // device token if it has one. An account with two-factor
        // authentication gets the code modal next; any other success opens
        // the dashboard.
        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            loginErrorMessage.style.display = 'none';
            signInButton.disabled = true;
            signInButton.textContent = 'Signing in…';

            try {
                // Left undefined when there's no stored token, which leaves
                // device_token out of the request.
                let deviceToken;
                const storedDeviceToken = localStorage.getItem('hq_device_token');
                if (storedDeviceToken) {
                    deviceToken = storedDeviceToken;
                }

                const data = await api('/auth/login', {
                    method: 'POST',
                    body: {
                        username: document.getElementById('username').value.trim().toLowerCase(),
                        password: document.getElementById('password').value,
                        device_token: deviceToken,
                    },
                });

                if (data.requires_totp) {
                    openTotpModal(data.totp_token);
                    return;
                }

                saveAuth(data.token, data.user);
                window.location.href = '/dashboard';
            } catch (error) {
                loginErrorMessage.textContent = error.message;
                loginErrorMessage.style.display = 'block';
                signInButton.disabled = false;
                signInButton.textContent = 'Sign in';
            }
        });
    </script>


    <script type="module" src="/sw-register.js"></script>

</body>

</html>
